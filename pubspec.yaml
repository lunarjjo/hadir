name: hadir
description: "Hadir — aplikasi absensi Android native (Flutter) untuk admin & member dalam satu aplikasi."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  # State management
  provider: 6.1.2
  # Database lokal (SQLite)
  sqflite: 2.3.3+1
  path: 1.9.0
  path_provider: 2.1.4
  # QR
  qr_flutter: 4.1.0
  mobile_scanner: 5.1.1
  # Lokasi GPS
  geolocator: 10.1.0
  # Preferensi ringan (tema dll)
  shared_preferences: 2.3.2
  # Kriptografi (PBKDF2/HMAC-SHA256)
  crypto: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  # SQLite FFI untuk unit test di CI/host
  sqflite_common_ffi: 2.3.3

flutter:
  uses-material-design: true
