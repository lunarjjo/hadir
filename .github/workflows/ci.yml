name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analisis & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Analisis statis
        run: flutter analyze

      - name: Pasang libsqlite3 untuk tes FFI
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev sqlite3

      - name: Unit test + integrasi + widget
        run: flutter test

  apk:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Pastikan gradlew dapat dieksekusi
        run: chmod +x android/gradlew

      - name: Build APK rilis (signed)
        run: flutter build apk --release

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Verifikasi APK (badging)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          aapt="$ANDROID_HOME/build-tools/$BT/aapt"
          $aapt dump badging build/app/outputs/flutter-apk/app-release.apk | head -12

      - name: Upload APK rilis
        uses: actions/upload-artifact@v4
        with:
          name: hadir-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: hadir-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  release:
    name: Rilis GitHub (khusus tag v*)
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hadir-apk-release
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: hadir-apk-debug
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-debug.apk
          generate_release_notes: true
